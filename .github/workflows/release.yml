name: Release

# Builds the native addon for every supported platform, then publishes the main
# package plus one `@fnf-postcss/<platform>` package per binary. npm installs
# only the platform package matching the machine, via optionalDependencies.
#
# Trigger by pushing a tag (`v0.1.0`), or by hand from the Actions tab. A run
# without NPM_TOKEN builds and packs everything but skips publishing, which is a
# useful dry run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl has no linker on the runners; zigbuild supplies one.
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Point cargo at zig for musl
        if: matrix.zig
        run: echo "CARGO_BUILD_TARGET_LINKER=zig" >> "$GITHUB_ENV"

      - name: Build
        working-directory: node
        run: node scripts/build.mjs --target ${{ matrix.target }}

      # Every runner here is native, so the addon it just built is loadable.
      - name: Smoke test the addon
        working-directory: node
        run: |
          node -e "
            const postcss = require('./lib/postcss.js')
            const css = 'a { color: red }'
            if (postcss.parse(css).toString() !== css) {
              throw new Error('round-trip is not byte-exact')
            }
            console.log('ok, core', require('./index.js').coreVersion())
          "

      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.target }}
          path: node/fnf-postcss.*.node
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: node/artifacts

      - name: Build the platform packages
        working-directory: node
        run: node scripts/platform-packages.mjs artifacts/*.node

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: node
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - name: Pack everything (always, so a dry run still proves it works)
        working-directory: node
        run: |
          for dir in npm/*; do (cd "$dir" && npm pack); done
          npm pack

      - name: Publish
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: node
        run: |
          npm config set provenance true
          # Platform packages first: the main package's optionalDependencies
          # point at them, and npm resolves those at install time.
          for dir in npm/*; do (cd "$dir" && npm publish --access public); done
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note a skipped publish
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::notice::No NPM_TOKEN secret set — built, packed and verified" \
               "everything but did not publish."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: node/**/*.tgz
